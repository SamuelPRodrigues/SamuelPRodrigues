name: Limpar histórico antigo da planilha

on:
  workflow_dispatch:
    inputs:
      cutoff_utc:
        description: "Corte UTC"
        required: true
        default: "2026-05-25T16:21:57Z"
      dry_run:
        description: "Simular sem apagar"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      confirm_delete:
        description: "Confirmação para apagar"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade google-api-python-client google-auth
      - name: Executar limpeza
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLEANUP_CUTOFF_UTC: ${{ inputs.cutoff_utc }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: python scripts/cleanup_google_sheets_events.py
      - name: Salvar relatório
        run: |
          git add data/google_sheets_cleanup_status.json || true
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Atualiza status da limpeza da planilha"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
