name: Atualizar eventos rodoviários

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-road-events:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Atualizar eventos via TomTom
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/update_road_events.py
      - name: Commitar mudanças
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza eventos rodoviários automáticos"
          file_pattern: data/road_events.json data/road_events_status.json
