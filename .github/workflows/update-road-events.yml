name: Atualizar eventos rodoviários

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-events-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-road-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Atualizar eventos via TomTom
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python scripts/update_road_events.py && exit 0
            echo "Tentativa $attempt falhou; tentando novamente..."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Preparar commit
        run: git add data/road_events.json data/road_events_status.json
      - name: Verificar mudanças
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commitar mudanças
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza eventos rodoviários automáticos"
      - name: Enviar mudanças com retry
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push falhou na tentativa $attempt; preparando nova tentativa..."
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          exit 1
