name: Atualizar dados do mapa

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - update_map_data

permissions:
  contents: write

concurrency:
  group: update-map-data-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ROAD_NEWS_STALE_HOURS: "4"
  NEWS_PUBLIC_LOOKBACK_HOURS: "12"
  PLANNED_ROAD_NEWS_URLS: "https://g1.globo.com/mg/sul-de-minas/noticia/2026/05/26/trecho-da-br-265-e-totalmente-interditado-para-obras-no-sul-de-minas-veja-rotas-alternativas.ghtml"

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar fontes de dados
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          set +e
          mkdir -p data

          run_py() {
            local seconds="$1"
            local label="$2"
            shift 2
            echo "::group::$label"
            timeout --preserve-status "${seconds}s" python "$@"
            local status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
              echo "Timeout em ${label} após ${seconds}s; seguindo com os dados disponíveis."
              status=124
            elif [ "$status" -ne 0 ]; then
              echo "${label} terminou com código ${status}; seguindo para não travar o workflow."
            fi
            echo "::endgroup::"
            return "$status"
          }

          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          config_path = Path('data/config.json')
          catalog_path = Path('data/road_corridors.csv')
          config = json.loads(config_path.read_text(encoding='utf-8')) if config_path.exists() else {}
          corridors = []
          if catalog_path.exists():
              with catalog_path.open('r', encoding='utf-8') as handle:
                  for row in csv.DictReader(handle, delimiter='|'):
                      try:
                          corridors.append({
                              'state': row.get('state', ''),
                              'city': row.get('city', ''),
                              'region': row.get('region', ''),
                              'name': f"{row.get('city', '').strip()} • {row.get('road', '').strip()}",
                              'lat': float(row.get('lat', '')),
                              'lon': float(row.get('lon', '')),
                              'road': row.get('road', '').strip(),
                              'source': 'data/road_corridors.csv'
                          })
                      except Exception:
                          pass
          if corridors:
              config['roadCorridors'] = corridors
              config['roadCorridorsSource'] = 'data/road_corridors.csv'
              config['roadCorridorsCount'] = len(corridors)
              config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'Catálogo rodoviário aplicado: {len(corridors)} corredor(es).')
          else:
              print('Catálogo rodoviário não encontrado ou vazio; seguindo com configuração existente.')
          PY

          run_py 90 "Clima" scripts/update_climate_events.py
          climate_status=$?
          run_py 150 "Rodovias e notícias públicas" scripts/update_road_events.py
          road_status=$?
          run_py 45 "Interdições rodoviárias planejadas por notícia" scripts/add_planned_road_news_events.py
          run_py 40 "Filtro de notícias rodoviárias antigas" scripts/filter_stale_road_news.py
          run_py 60 "Alertas operacionais" scripts/update_operational_alerts.py
          operational_status=$?
          run_py 75 "Notícias suplementares" scripts/update_news_supplemental_events.py
          news_supplemental_status=$?
          run_py 75 "Eventos manuais da planilha" scripts/update_manual_events_from_sheet.py
          manual_status=$?
          run_py 45 "Reclassificação rodoviária" scripts/reclassify_road_severity.py
          run_py 45 "Consolidação de notícias rodoviárias" scripts/dedupe_road_news_events.py
          run_py 45 "Interdições rodoviárias planejadas por notícia" scripts/add_planned_road_news_events.py
          run_py 40 "Filtro final de notícias rodoviárias antigas" scripts/filter_stale_road_news.py
          run_py 60 "Rastreador de ciclo de vida" scripts/track_event_lifecycle.py
          run_py 45 "Normalização de duração de notícias rodoviárias" scripts/normalize_road_news_lifecycle.py

          export CLIMATE_STATUS="$climate_status"
          export ROAD_STATUS="$road_status"
          export OPERATIONAL_STATUS="$operational_status"
          export NEWS_SUPPLEMENTAL_STATUS="$news_supplemental_status"
          export MANUAL_STATUS="$manual_status"

          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          health = {
              'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'workflow': 'Atualizar dados do mapa',
              'trigger': os.environ.get('GITHUB_EVENT_NAME', ''),
              'climateExitCode': int(os.environ.get('CLIMATE_STATUS', '0')),
              'roadExitCode': int(os.environ.get('ROAD_STATUS', '0')),
              'operationalExitCode': int(os.environ.get('OPERATIONAL_STATUS', '0')),
              'newsSupplementalExitCode': int(os.environ.get('NEWS_SUPPLEMENTAL_STATUS', '0')),
              'manualSheetExitCode': int(os.environ.get('MANUAL_STATUS', '0')),
              'scriptTimeoutPolicy': 'Cada fonte tem timeout próprio; se uma chamada externa travar, o workflow segue com os dados disponíveis.',
              'roadSeverityRule': 'Eventos de bloqueio/interdição de rodovia têm teto 69, severidade Alta.',
              'roadNewsDuplicatePolicy': 'Noticias publicas da mesma situacao rodoviaria sao consolidadas em um unico evento.',
              'roadNewsFreshnessPolicy': 'Noticias publicas rodoviarias ativas precisam ter ate 12 horas, exceto interdição planejada com período informado.',
              'plannedRoadNewsPolicy': 'Quando a notícia informa plannedStartAt/plannedEndAt, o evento fica ativo dentro desse período salvo notícia posterior de liberação.',
              'eventLifecyclePolicy': 'Rastreador registra first_seen_at, last_seen_at, duração ativa e desativa notícias públicas rodoviárias sem reconfirmação após 4 horas.',
              'note': 'Arquivo de auditoria: se este timestamp mudou, o workflow executou.'
          }
          Path('data/update_health.json').write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          supplemental = Path('data/news_supplemental_events_status.json')
          if not supplemental.exists():
              supplemental.write_text(json.dumps({
                  'updatedAt': health['updatedAt'],
                  'provider': 'Google News RSS - eventos suplementares',
                  'ok': False,
                  'note': 'Arquivo criado pelo workflow porque o script suplementar não gerou status nesta execução.',
                  'newsSupplementalExitCode': health['newsSupplementalExitCode'],
                  'climateEventsAdded': 0,
                  'roadEventsAdded': 0
              }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Normalizar rodovias para exibicao
        run: |
          set +e
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          for filename in ('data/road_events.json', 'data/manual_events.json'):
              path = Path(filename)
              if not path.exists():
                  continue
              events = json.loads(path.read_text(encoding='utf-8') or '[]')
              for event in events:
                  if event.get('type') not in (None, 'road') and filename.endswith('manual_events.json'):
                      continue
                  road = str(event.get('road') or '').strip()
                  corridor = str(event.get('corridor') or '').strip()
                  match = re.search(r'\bBR-?\s?\d{2,4}\b', corridor, re.I)
                  if event.get('isMainRoad') and match and 'BR' not in road.upper():
                      br = match.group(0).upper().replace(' ', '')
                      event['detectedRoad'] = road
                      event['road'] = f'{br} / {road}'
                      event['name'] = f"{event.get('eventType', 'Evento')} • {event['road']}"
              path.write_text(json.dumps(events, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          timeout --preserve-status 45s python scripts/reclassify_road_severity.py || true
          timeout --preserve-status 45s python scripts/dedupe_road_news_events.py || true
          timeout --preserve-status 45s python scripts/add_planned_road_news_events.py || true
          timeout --preserve-status 40s python scripts/filter_stale_road_news.py || true
          timeout --preserve-status 60s python scripts/track_event_lifecycle.py || true
          timeout --preserve-status 45s python scripts/normalize_road_news_lifecycle.py || true

      - name: Sincronizar historico permanente no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          timeout --preserve-status 150s python scripts/sync_events_to_supabase.py || true
          timeout --preserve-status 45s python scripts/dedupe_road_news_events.py || true
          timeout --preserve-status 45s python scripts/add_planned_road_news_events.py || true
          timeout --preserve-status 40s python scripts/filter_stale_road_news.py || true
          timeout --preserve-status 60s python scripts/track_event_lifecycle.py || true
          timeout --preserve-status 45s python scripts/normalize_road_news_lifecycle.py || true

      - name: Preparar commit
        run: |
          files="index.html data/climate_events.json data/climate_events_status.json data/road_events.json data/road_events_status.json data/planned_road_events_state.json data/planned_road_events_status.json data/road_news_freshness_status.json data/road_news_lifecycle_normalize_status.json data/operational_alerts.json data/operational_alerts_status.json data/news_supplemental_events_status.json data/manual_events.json data/manual_events_status.json data/update_health.json data/supabase_sync_status.json data/supabase_analytics_cache.json data/analytics_cache.json data/road_severity_reclassify_status.json data/road_news_dedupe_status.json data/event_lifecycle_state.json data/event_lifecycle_status.json data/deactivated_events.json"
          for file in $files; do
            if [ -e "$file" ]; then
              git add "$file"
            else
              echo "Arquivo opcional ausente, ignorando: $file"
            fi
          done

      - name: Verificar mudancas
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza dados automaticos do mapa"

      - name: Enviar mudancas com retry
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "Tentativa $attempt de sincronizar e enviar mudanças..."
            git status --short
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push realizado com sucesso."
              exit 0
            fi
            echo "Falha na tentativa $attempt. Limpando rebase pendente e aguardando..."
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Não foi possível enviar as mudanças após múltiplas tentativas."
          exit 1

      - name: Solicitar publicacao do GitHub Pages
        if: steps.verify_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=deploy_pages
