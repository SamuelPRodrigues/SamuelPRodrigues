name: Atualizar dados do mapa

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map-data-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar janela de atualizacao
        id: update_window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          should_update = False
          age_minutes = 9999.0
          reason = 'sem histórico de atualização'

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              should_update = True
              reason = 'execução manual'
          else:
              health_path = Path('data/update_health.json')
              if health_path.exists():
                  try:
                      health = json.loads(health_path.read_text(encoding='utf-8'))
                      updated_at = str(health.get('updatedAt') or '').replace('Z', '+00:00')
                      last = datetime.fromisoformat(updated_at).astimezone(timezone.utc)
                      now = datetime.now(timezone.utc)
                      age_minutes = (now - last).total_seconds() / 60
                      should_update = age_minutes >= 12
                      reason = f'última atualização há {age_minutes:.1f} min'
                  except Exception as exc:
                      should_update = True
                      reason = f'falha ao ler auditoria: {exc}'
              else:
                  should_update = True

          print(f"should_update={'true' if should_update else 'false'}")
          print(f"age_minutes={age_minutes:.1f}")
          print(f"reason={reason}")
          PY

      - name: Mostrar decisao de atualizacao
        run: |
          echo "should_update=${{ steps.update_window.outputs.should_update }}"
          echo "reason=${{ steps.update_window.outputs.reason }}"

      - name: Atualizar fontes de dados
        if: steps.update_window.outputs.should_update == 'true'
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          set +e
          mkdir -p data

          python scripts/update_climate_events.py
          climate_status=$?
          python scripts/update_road_events.py
          road_status=$?
          python scripts/update_operational_alerts.py
          operational_status=$?
          python scripts/update_manual_events_from_sheet.py
          manual_status=$?

          export CLIMATE_STATUS="$climate_status"
          export ROAD_STATUS="$road_status"
          export OPERATIONAL_STATUS="$operational_status"
          export MANUAL_STATUS="$manual_status"

          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          health = {
              'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'workflow': 'Atualizar dados do mapa',
              'climateExitCode': int(os.environ.get('CLIMATE_STATUS', '0')),
              'roadExitCode': int(os.environ.get('ROAD_STATUS', '0')),
              'operationalExitCode': int(os.environ.get('OPERATIONAL_STATUS', '0')),
              'manualSheetExitCode': int(os.environ.get('MANUAL_STATUS', '0')),
              'note': 'Arquivo de auditoria: se este timestamp mudou, o workflow executou.'
          }
          Path('data/update_health.json').write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Normalizar rodovias para exibicao
        if: steps.update_window.outputs.should_update == 'true'
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          for filename in ('data/road_events.json', 'data/manual_events.json'):
              path = Path(filename)
              if not path.exists():
                  continue
              events = json.loads(path.read_text(encoding='utf-8') or '[]')
              for event in events:
                  if event.get('type') not in (None, 'road') and filename.endswith('manual_events.json'):
                      continue
                  road = str(event.get('road') or '').strip()
                  corridor = str(event.get('corridor') or '').strip()
                  match = re.search(r'\bBR-?\s?\d{2,4}\b', corridor, re.I)
                  if event.get('isMainRoad') and match and 'BR' not in road.upper():
                      br = match.group(0).upper().replace(' ', '')
                      event['detectedRoad'] = road
                      event['road'] = f'{br} / {road}'
                      event['name'] = f"{event.get('eventType', 'Evento')} • {event['road']}"
              path.write_text(json.dumps(events, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Preparar commit
        if: steps.update_window.outputs.should_update == 'true'
        run: git add data/climate_events.json data/climate_events_status.json data/road_events.json data/road_events_status.json data/operational_alerts.json data/operational_alerts_status.json data/manual_events.json data/manual_events_status.json data/update_health.json

      - name: Verificar mudancas
        if: steps.update_window.outputs.should_update == 'true'
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar mudancas
        if: steps.update_window.outputs.should_update == 'true' && steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza dados automaticos do mapa"

      - name: Enviar mudancas
        if: steps.update_window.outputs.should_update == 'true' && steps.verify_diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
