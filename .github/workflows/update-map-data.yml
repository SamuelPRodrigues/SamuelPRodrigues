name: Atualizar dados do mapa

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map-data-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar clima
        run: python scripts/update_climate_events.py

      - name: Atualizar rodovias
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/update_road_events.py

      - name: Atualizar alertas operacionais
        run: python scripts/update_operational_alerts.py

      - name: Normalizar rodovias para exibicao
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('data/road_events.json')
          if path.exists():
              events = json.loads(path.read_text(encoding='utf-8') or '[]')
              for event in events:
                  road = str(event.get('road') or '').strip()
                  corridor = str(event.get('corridor') or '').strip()
                  match = re.search(r'\bBR-?\s?\d{2,4}\b', corridor, re.I)
                  if event.get('isMainRoad') and match and 'BR' not in road.upper():
                      br = match.group(0).upper().replace(' ', '')
                      event['detectedRoad'] = road
                      event['road'] = f'{br} / {road}'
                      event['name'] = f"{event.get('eventType', 'Evento')} • {event['road']}"
              path.write_text(json.dumps(events, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Preparar commit
        run: git add data/climate_events.json data/climate_events_status.json data/road_events.json data/road_events_status.json data/operational_alerts.json data/operational_alerts_status.json

      - name: Verificar mudancas
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza dados automaticos do mapa"

      - name: Enviar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
