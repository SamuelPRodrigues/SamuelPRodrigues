name: Atualizar alertas operacionais

on:
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-alerts-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-operational-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Atualizar alertas operacionais
        run: |
          for attempt in 1 2 3; do
            python3 scripts/update_operational_alerts.py && exit 0
            echo "Tentativa $attempt falhou; tentando novamente..."
            sleep $((attempt * 15))
          done
          exit 1
      - name: Preparar commit
        run: git add data/operational_alerts.json data/operational_alerts_status.json
      - name: Verificar mudanças
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commitar mudanças
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza alertas operacionais automáticos"
      - name: Enviar mudanças com retry
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push falhou na tentativa $attempt; preparando nova tentativa..."
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          exit 1
