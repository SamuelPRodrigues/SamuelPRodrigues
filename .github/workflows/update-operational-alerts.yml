name: Atualizar alertas operacionais

on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-alerts-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-operational-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Atualizar alertas operacionais
        run: python3 scripts/update_operational_alerts.py
      - name: Preparar commit
        run: git add data/operational_alerts.json data/operational_alerts_status.json
      - name: Verificar mudancas
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commitar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza alertas operacionais automaticos"
      - name: Enviar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
