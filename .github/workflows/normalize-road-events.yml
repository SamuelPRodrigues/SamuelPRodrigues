name: Normalizar eventos rodoviarios para o mapa

on:
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-road-events-main
  cancel-in-progress: false

jobs:
  normalize-road-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Normalizar nomes de rodovias
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('data/road_events.json')
          if not path.exists():
              raise SystemExit(0)

          events = json.loads(path.read_text(encoding='utf-8') or '[]')
          changed = False
          for event in events:
              road = str(event.get('road') or '').strip()
              corridor = str(event.get('corridor') or '').strip()
              match = re.search(r'\bBR-?\s?\d{2,4}\b', corridor, re.I)
              if event.get('isMainRoad') and match and 'BR' not in road.upper():
                  br = match.group(0).upper().replace(' ', '')
                  event['detectedRoad'] = road
                  event['road'] = f'{br} / {road}'
                  event['name'] = f"{event.get('eventType', 'Evento')} • {event['road']}"
                  changed = True

          if changed:
              path.write_text(json.dumps(events, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Preparar commit
        run: git add data/road_events.json
      - name: Verificar mudancas
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commitar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Normaliza eventos rodoviarios para o mapa"
      - name: Enviar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: git push origin HEAD:main
