name: Atualizar todos os dados

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - update_all_data
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: update-all-data-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-all-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aguardar estabilidade inicial
        run: sleep 120
      - name: Atualizar clima
        run: python scripts/update_climate_events.py
      - name: Pausa antes de rodovias
        run: sleep 300
      - name: Atualizar rodovias
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python scripts/update_road_events.py
      - name: Pausa antes de operacionais
        run: sleep 300
      - name: Atualizar alertas operacionais
        run: python3 scripts/update_operational_alerts.py
      - name: Pausa antes do commit
        run: sleep 180
      - name: Preparar commit
        run: |
          git add data/climate_events.json data/climate_events_status.json || true
          git add data/road_events.json data/road_events_status.json || true
          git add data/operational_alerts.json data/operational_alerts_status.json || true
      - name: Verificar mudancas
        id: verify_diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commitar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Atualiza dados automaticos do mapa"
      - name: Enviar mudancas
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
