name: Agendar atualização dos dados do mapa

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: schedule-map-data-main
  cancel-in-progress: true

jobs:
  dispatch-update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar workflow de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/$REPO/dispatches \
            -f event_type=update_map_data
