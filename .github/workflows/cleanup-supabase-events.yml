name: Limpar histórico antigo do Supabase

on:
  workflow_dispatch:
    inputs:
      cutoff_utc:
        description: "Apagar eventos com data anterior a este horário UTC"
        required: true
        default: "2026-05-25T16:21:57Z"
      dry_run:
        description: "Simular sem apagar"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      confirm_delete:
        description: "Digite DELETE_OLD_EVENTS para apagar de verdade"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Limpar registros antigos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLEANUP_CUTOFF_UTC: ${{ inputs.cutoff_utc }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: python scripts/cleanup_supabase_events.py

      - name: Commitar status da limpeza
        run: |
          git add data/supabase_cleanup_status.json data/supabase_analytics_cache.json data/analytics_cache.json || true
          if git diff --cached --quiet; then
            echo "Nenhum arquivo de status/cache mudou."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Atualiza status da limpeza do Supabase"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Solicitar publicacao do GitHub Pages
        if: inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=deploy_pages
