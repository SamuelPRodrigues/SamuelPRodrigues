name: Atualizar eventos climaticos

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write

jobs:
  update-climate-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar eventos climaticos
        run: python scripts/update_climate_events.py
      - name: Commit automatico
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Atualiza eventos climaticos
          file_pattern: data/climate_events.json data/climate_events_status.json
