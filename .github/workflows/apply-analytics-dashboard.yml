name: Aplicar dashboard de analises

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-analytics-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Trocar versao do painel de analises
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          for old in (
              '<script src="analytics-panel.js?v=1"></script>',
              '<script src="analytics-panel.js?v=2"></script>',
              '<script src="analytics-panel.js?v=3"></script>',
              '<script src="analytics-panel.js"></script>',
          ):
              text = text.replace(old, '')
          text = text.replace('</body>', '<script src="analytics-panel.js?v=4"></script>\n</body>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verificar mudancas
        id: diff
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar mudanca
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Aplica dashboard de analises v4"

      - name: Enviar mudanca
        if: steps.diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
