name: Aplicar dashboard de analises

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-analytics-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Trocar painel antigo pelo novo dashboard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\n?<script src="analytics-panel\.js[^\"]*"></script>', '', text)
          text = re.sub(r'\n?<script src="analytics-dashboard\.js[^\"]*"></script>', '', text)
          text = text.replace('</body>', '<script src="analytics-dashboard.js?v=1"></script>\n</body>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verificar mudancas
        id: diff
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar mudanca
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Aplica novo dashboard de analises"

      - name: Enviar mudanca
        if: steps.diff.outputs.changed == 'true'
        run: |
          git pull --rebase --autostash origin main
          git push origin HEAD:main
