<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa operacional</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --dock-collapsed:72px;
      --dock-expanded:224px;
      --bg:#071120;
      --panel:#0b1628;
      --panel-soft:#102039;
      --line:#244066;
      --text:#eaf2ff;
      --muted:#9db2d4;
      --accent:#2563eb;
      --icon:#bfdbfe;
    }
    *{box-sizing:border-box}
    html,body,#map{height:100%;width:100%;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);overflow:hidden;color:var(--text)}
    #map{position:fixed;inset:0;z-index:1}
    .dock{position:fixed;z-index:1000;top:0;left:0;bottom:0;width:var(--dock-collapsed);background:rgba(7,17,32,.97);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 10px;gap:12px;transition:width .22s ease;box-shadow:12px 0 28px rgba(0,0,0,.24)}
    .dock.expanded{width:var(--dock-expanded);align-items:stretch}
    .toggle{width:48px;height:48px;border-radius:16px;border:1px solid rgba(96,165,250,.28);background:rgba(15,35,64,.58);display:grid;place-items:center;cursor:pointer;margin:0 auto 4px;color:var(--icon);transition:background .16s ease,border-color .16s ease,transform .16s ease}
    .toggle:hover{background:rgba(37,99,235,.24);border-color:rgba(147,197,253,.55);transform:translateY(-1px)}
    .toggle-icon{width:24px;height:24px;background:var(--icon);-webkit-mask:url('assets/icons/Expandir.png') center/contain no-repeat;mask:url('assets/icons/Expandir.png') center/contain no-repeat}
    .dock.expanded .toggle{margin-left:auto;margin-right:0}
    .dock.expanded .toggle-icon{-webkit-mask-image:url('assets/icons/Retrair.png');mask-image:url('assets/icons/Retrair.png')}
    .nav{display:grid;gap:10px;width:100%}
    .nav-item{height:48px;width:48px;margin:0 auto;border-radius:16px;border:1px solid rgba(96,165,250,.22);background:rgba(15,35,64,.46);display:flex;align-items:center;justify-content:center;gap:12px;color:var(--text);font-weight:800;letter-spacing:.01em;user-select:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}
    .nav-item:hover{background:rgba(36,72,122,.42);border-color:rgba(147,197,253,.45);transform:translateX(1px)}
    .dock.expanded .nav-item{width:100%;justify-content:flex-start;padding:0 14px;margin:0}
    .nav-icon{width:26px;height:26px;flex:0 0 26px;background:var(--icon);-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
    .dock.expanded .nav-label{display:block}.nav-label{display:none;font-size:15px;white-space:nowrap}
    .map-icon{-webkit-mask-image:url('assets/icons/Mapa.png');mask-image:url('assets/icons/Mapa.png')}
    .events-icon{-webkit-mask-image:url('assets/icons/Eventos.png');mask-image:url('assets/icons/Eventos.png')}
    .dashboard-icon{-webkit-mask-image:url('assets/icons/Dashboard.png');mask-image:url('assets/icons/Dashboard.png')}
    .favorites-icon{-webkit-mask-image:url('assets/icons/Favoritos.png');mask-image:url('assets/icons/Favoritos.png')}
    .brand{position:fixed;z-index:900;right:16px;bottom:16px;background:rgba(7,17,32,.82);border:1px solid rgba(96,165,250,.18);border-radius:14px;color:var(--muted);font-size:12px;padding:8px 10px;backdrop-filter:blur(8px)}
    .leaflet-control-zoom{border:1px solid rgba(96,165,250,.25)!important;border-radius:12px!important;overflow:hidden!important;box-shadow:0 12px 24px rgba(0,0,0,.22)!important}
    .leaflet-control-zoom a{background:#0b1628!important;color:#dbeafe!important;border-color:#244066!important}
    .leaflet-control-attribution{background:rgba(255,255,255,.75)!important;border-radius:8px 0 0 0!important}
    @media(max-width:640px){.dock.expanded{width:min(220px,72vw)}.brand{display:none}}
  </style>
</head>
<body>
  <div id="map" aria-label="Mapa operacional"></div>
  <aside id="dock" class="dock" aria-label="Barra lateral">
    <button id="dockToggle" class="toggle" type="button" aria-label="Expandir barra lateral" aria-expanded="false"><span class="toggle-icon"></span></button>
    <nav class="nav" aria-label="Navegação visual">
      <div class="nav-item" title="Mapa"><span class="nav-icon map-icon"></span><span class="nav-label">Mapa</span></div>
      <div class="nav-item" title="Leitura"><span class="nav-icon events-icon"></span><span class="nav-label">Leitura</span></div>
      <div class="nav-item" title="Dashboard"><span class="nav-icon dashboard-icon"></span><span class="nav-label">Dashboard</span></div>
      <div class="nav-item" title="Favoritos"><span class="nav-icon favorites-icon"></span><span class="nav-label">Favoritos</span></div>
    </nav>
  </aside>
  <div class="brand">Mapa base • sem camadas de dados</div>
  <script>
    const dock=document.getElementById('dock');
    const toggle=document.getElementById('dockToggle');
    const saved=localStorage.getItem('minimalDockExpanded')==='1';
    function setDock(expanded){
      dock.classList.toggle('expanded',expanded);
      toggle.setAttribute('aria-expanded',String(expanded));
      toggle.setAttribute('aria-label',expanded?'Recolher barra lateral':'Expandir barra lateral');
      localStorage.setItem('minimalDockExpanded',expanded?'1':'0');
      setTimeout(()=>map.invalidateSize(true),240);
    }
    toggle.addEventListener('click',()=>setDock(!dock.classList.contains('expanded')));
    setDock(saved);
    const map=L.map('map',{zoomControl:false,worldCopyJump:true}).setView([-14.2,-52.2],4);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
    setTimeout(()=>map.invalidateSize(true),250);
    window.addEventListener('resize',()=>map.invalidateSize(true));
  </script>
</body>
</html>
