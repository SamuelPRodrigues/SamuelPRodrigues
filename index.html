<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa operacional</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <style>
    :root{
      --dock-collapsed:72px;
      --dock-expanded:224px;
      --bg:#071120;
      --panel:#0b1628;
      --panel-soft:#102039;
      --line:#244066;
      --text:#eaf2ff;
      --muted:#9db2d4;
      --accent:#2563eb;
      --icon:#bfdbfe;
      --climate:#f97316;
      --road:#3b82f6;
      --operational:#a855f7;
      --heat-low:#22c55e;
      --heat-mid:#f59e0b;
      --heat-high:#ef4444;
    }
    *{box-sizing:border-box}
    html,body,#map{height:100%;width:100%;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);overflow:hidden;color:var(--text)}
    #map{position:fixed;inset:0;z-index:1}
    .dock{position:fixed;z-index:1000;top:0;left:0;bottom:0;width:var(--dock-collapsed);background:rgba(7,17,32,.97);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 10px;gap:12px;transition:width .22s ease;box-shadow:12px 0 28px rgba(0,0,0,.24)}
    .dock.expanded{width:var(--dock-expanded);align-items:stretch}
    .toggle{width:48px;height:48px;border-radius:16px;border:1px solid rgba(96,165,250,.28);background:rgba(15,35,64,.58);display:grid;place-items:center;cursor:pointer;margin:0 auto 4px;color:var(--icon);transition:background .16s ease,border-color .16s ease,transform .16s ease}
    .toggle:hover{background:rgba(37,99,235,.24);border-color:rgba(147,197,253,.55);transform:translateY(-1px)}
    .toggle-icon{width:24px;height:24px;background:var(--icon);-webkit-mask:url('assets/icons/Expandir.png') center/contain no-repeat;mask:url('assets/icons/Expandir.png') center/contain no-repeat}
    .dock.expanded .toggle{margin-left:auto;margin-right:0}
    .dock.expanded .toggle-icon{-webkit-mask-image:url('assets/icons/Retrair.png');mask-image:url('assets/icons/Retrair.png')}
    .nav{display:grid;gap:10px;width:100%}
    .nav-item{height:48px;width:48px;margin:0 auto;border-radius:16px;border:1px solid rgba(96,165,250,.22);background:rgba(15,35,64,.46);display:flex;align-items:center;justify-content:center;gap:12px;color:var(--text);font-weight:800;letter-spacing:.01em;user-select:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}
    .nav-item:hover{background:rgba(36,72,122,.42);border-color:rgba(147,197,253,.45);transform:translateX(1px)}
    .dock.expanded .nav-item{width:100%;justify-content:flex-start;padding:0 14px;margin:0}
    .nav-icon{width:26px;height:26px;flex:0 0 26px;background:var(--icon);-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
    .dock.expanded .nav-label{display:block}.nav-label{display:none;font-size:15px;white-space:nowrap}
    .map-icon{-webkit-mask-image:url('assets/icons/Mapa.png');mask-image:url('assets/icons/Mapa.png')}
    .events-icon{-webkit-mask-image:url('assets/icons/Eventos.png');mask-image:url('assets/icons/Eventos.png')}
    .dashboard-icon{-webkit-mask-image:url('assets/icons/Dashboard.png');mask-image:url('assets/icons/Dashboard.png')}
    .favorites-icon{-webkit-mask-image:url('assets/icons/Favoritos.png');mask-image:url('assets/icons/Favoritos.png')}
    .legend{position:fixed;z-index:900;right:16px;bottom:16px;width:min(340px,calc(100vw - 104px));background:rgba(7,17,32,.90);border:1px solid rgba(96,165,250,.20);border-radius:16px;color:var(--text);padding:14px;backdrop-filter:blur(10px);box-shadow:0 18px 44px rgba(0,0,0,.28)}
    .legend-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
    .legend-title{font-weight:900;font-size:14px;line-height:1.2}.legend-sub{font-size:11px;color:var(--muted);margin-top:3px}.legend-count{font-size:11px;color:#93c5fd;text-align:right;white-space:nowrap}
    .legend-rows{display:grid;gap:7px;margin-top:8px}.legend-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;color:#dbeafe;font-size:12px}.legend-row b{font-size:12px;color:#93c5fd}.legend-icon{width:24px;height:24px;display:grid;place-items:center;color:white;font-size:10px;font-weight:950;border:2px solid rgba(255,255,255,.86);box-shadow:0 6px 14px rgba(0,0,0,.25)}
    .legend-icon.climate{border-radius:999px;background:var(--climate)}.legend-icon.road{border-radius:9px 9px 9px 2px;background:var(--road);transform:rotate(-45deg)}.legend-icon.road span{transform:rotate(45deg)}.legend-icon.operational{border-radius:8px;background:var(--operational);transform:rotate(45deg)}.legend-icon.operational span{transform:rotate(-45deg)}
    .heat-tools{margin-top:12px;padding-top:12px;border-top:1px solid rgba(96,165,250,.16);display:grid;gap:8px}.heat-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#dbeafe}.heat-toggle input{accent-color:var(--accent)}.heat-scale{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--heat-low),var(--heat-mid),var(--heat-high));border:1px solid rgba(255,255,255,.12)}.heat-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
    .event-marker{width:30px;height:30px;display:grid;place-items:center;color:white;font-weight:950;font-size:10px;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 0 5px rgba(7,17,32,.22),0 10px 24px rgba(0,0,0,.34)}
    .event-marker.climate{background:var(--climate);border-radius:999px}.event-marker.road{background:var(--road);border-radius:10px 10px 10px 2px;transform:rotate(-45deg)}.event-marker.road span{transform:rotate(45deg)}.event-marker.operational{background:var(--operational);border-radius:8px;transform:rotate(45deg)}.event-marker.operational span{transform:rotate(-45deg)}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1628!important;color:#eaf2ff!important;border:1px solid rgba(96,165,250,.22)}.leaflet-popup-content{margin:12px!important;min-width:220px}.popup-title{font-weight:900;margin-bottom:6px}.popup-meta{font-size:12px;color:#9db2d4;line-height:1.45}.popup-risk{display:inline-block;margin-top:8px;border-radius:999px;background:#102039;color:#dbeafe;padding:4px 8px;font-size:12px;font-weight:800}
    .leaflet-control-zoom{border:1px solid rgba(96,165,250,.25)!important;border-radius:12px!important;overflow:hidden!important;box-shadow:0 12px 24px rgba(0,0,0,.22)!important}.leaflet-control-zoom a{background:#0b1628!important;color:#dbeafe!important;border-color:#244066!important}.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;border-radius:8px 0 0 0!important}
    @media(max-width:640px){.dock.expanded{width:min(220px,72vw)}.legend{right:10px;bottom:10px;width:calc(100vw - 92px);padding:12px}}
  </style>
</head>
<body>
  <div id="map" aria-label="Mapa operacional"></div>
  <aside id="dock" class="dock" aria-label="Barra lateral">
    <button id="dockToggle" class="toggle" type="button" aria-label="Expandir barra lateral" aria-expanded="false"><span class="toggle-icon"></span></button>
    <nav class="nav" aria-label="Navegação visual">
      <div class="nav-item" title="Mapa"><span class="nav-icon map-icon"></span><span class="nav-label">Mapa</span></div>
      <div class="nav-item" title="Leitura"><span class="nav-icon events-icon"></span><span class="nav-label">Leitura</span></div>
      <div class="nav-item" title="Dashboard"><span class="nav-icon dashboard-icon"></span><span class="nav-label">Dashboard</span></div>
      <div class="nav-item" title="Favoritos"><span class="nav-icon favorites-icon"></span><span class="nav-label">Favoritos</span></div>
    </nav>
  </aside>
  <section class="legend" aria-label="Legenda e mapa de calor">
    <div class="legend-head">
      <div><div class="legend-title">Legenda e mapa de calor</div><div class="legend-sub">Eventos gerados pelos arquivos de dados</div></div>
      <div id="eventCount" class="legend-count">Carregando...</div>
    </div>
    <div class="legend-rows">
      <div class="legend-row"><i class="legend-icon climate"><span>CL</span></i><span>Clima</span><b id="countClimate">0</b></div>
      <div class="legend-row"><i class="legend-icon road"><span>BR</span></i><span>Rodovia</span><b id="countRoad">0</b></div>
      <div class="legend-row"><i class="legend-icon operational"><span>OP</span></i><span>Operacional</span><b id="countOperational">0</b></div>
    </div>
    <div class="heat-tools">
      <label class="heat-toggle"><span>Mapa de calor</span><input id="heatToggle" type="checkbox" checked></label>
      <div class="heat-scale"></div>
      <div class="heat-labels"><span>menor risco</span><span>maior risco</span></div>
    </div>
  </section>
  <script>
    const dock=document.getElementById('dock');
    const toggle=document.getElementById('dockToggle');
    const saved=localStorage.getItem('minimalDockExpanded')==='1';
    let heatLayer=null;
    const markerLayer=L.layerGroup();
    function setDock(expanded){
      dock.classList.toggle('expanded',expanded);
      toggle.setAttribute('aria-expanded',String(expanded));
      toggle.setAttribute('aria-label',expanded?'Recolher barra lateral':'Expandir barra lateral');
      localStorage.setItem('minimalDockExpanded',expanded?'1':'0');
      setTimeout(()=>map.invalidateSize(true),240);
    }
    toggle.addEventListener('click',()=>setDock(!dock.classList.contains('expanded')));
    const map=L.map('map',{zoomControl:false,worldCopyJump:true}).setView([-14.2,-52.2],4);
    setDock(saved);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
    markerLayer.addTo(map);
    setTimeout(()=>map.invalidateSize(true),250);
    window.addEventListener('resize',()=>map.invalidateSize(true));

    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num=v=>Number(v)||0;
    async function getJson(path){
      try{const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});return r.ok?await r.json():[]}catch(e){return[]}
    }
    function latOf(x){return Number(x.lat??x.latitude??x.Latitude)}
    function lonOf(x){return Number(x.lon??x.lng??x.longitude??x.Longitude)}
    function riskOf(x,type){const fallback=type==='road'?58:type==='operational'?62:45;return Math.max(0,Math.min(100,num(x.risk||x.score||fallback)))}
    function titleOf(x,type){return x.name||x.road||x.title||x.headline||x.event_type||x.eventType||({climate:'Evento climático',road:'Evento rodoviário',operational:'Alerta operacional'}[type])}
    function descOf(x){return x.description||x.summary||x.event_type||x.eventType||x.source||''}
    function iconHtml(type){const text=type==='road'?'BR':type==='operational'?'OP':'CL';return `<div class="event-marker ${type}"><span>${text}</span></div>`}
    function markerIcon(type){return L.divIcon({className:'',html:iconHtml(type),iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-16]})}
    function normalize(type,x){
      const lat=latOf(x),lon=lonOf(x);
      if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
      return {type,lat,lon,risk:riskOf(x,type),title:titleOf(x,type),desc:descOf(x),raw:x};
    }
    async function loadEvents(){
      const [climate,road,operational]=await Promise.all([
        getJson('data/climate_events.json'),
        getJson('data/road_events.json'),
        getJson('data/operational_alerts.json')
      ]);
      const events=[];
      [['climate',climate],['road',road],['operational',operational]].forEach(([type,list])=>{
        (Array.isArray(list)?list:[]).forEach(item=>{
          if(item&&item.active!==false){const ev=normalize(type,item);if(ev)events.push(ev)}
        });
      });
      renderEvents(events);
    }
    function popup(ev){
      return `<div class="popup-title">${esc(ev.title)}</div><div class="popup-meta">${esc(ev.desc||'Sem descrição adicional.')}<br>Tipo: ${ev.type==='road'?'Rodovia':ev.type==='operational'?'Operacional':'Clima'}</div><span class="popup-risk">Risco ${ev.risk}/100</span>`;
    }
    function renderEvents(events){
      markerLayer.clearLayers();
      if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
      const counts={climate:0,road:0,operational:0};
      const heat=[];
      events.forEach(ev=>{
        counts[ev.type]=(counts[ev.type]||0)+1;
        L.marker([ev.lat,ev.lon],{icon:markerIcon(ev.type)}).bindPopup(popup(ev)).addTo(markerLayer);
        heat.push([ev.lat,ev.lon,Math.max(.25,ev.risk/100)]);
      });
      $('countClimate').textContent=counts.climate||0;
      $('countRoad').textContent=counts.road||0;
      $('countOperational').textContent=counts.operational||0;
      $('eventCount').textContent=`${events.length} evento(s)`;
      if(window.L&&L.heatLayer&&heat.length){
        heatLayer=L.heatLayer(heat,{radius:32,blur:24,maxZoom:8,minOpacity:.25,gradient:{.25:'#22c55e',.55:'#f59e0b',.85:'#ef4444'}});
        if($('heatToggle').checked)heatLayer.addTo(map);
      }
      const group=L.featureGroup(events.map(ev=>L.marker([ev.lat,ev.lon])));
      if(events.length){try{map.fitBounds(group.getBounds().pad(.18),{maxZoom:5,animate:false})}catch(e){}}
    }
    $('heatToggle').addEventListener('change',e=>{
      if(!heatLayer)return;
      if(e.target.checked)heatLayer.addTo(map);else map.removeLayer(heatLayer);
    });
    loadEvents();
  </script>
</body>
</html>
